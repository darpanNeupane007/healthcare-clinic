<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Clinic</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>

<body>
    <header>
        <h1>Welcome to Healthcare Clinic</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#bmi">BMI Calculator</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Home Section -->
        <section id="home" class="animate-on-scroll">
            <h2>Your Health Matters</h2>
            <p>We provide excellent healthcare services for your well-being.</p>
        </section>

        <!-- BMI Calculator Section -->
        <section id="bmi" class="animate-on-scroll">
            <h2>BMI Calculator</h2>
            <form id="bmi-form">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" required>
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" required>
                <button type="button" onclick="calculateBMI()">Calculate</button>
            </form>
            <p id="bmi-result"></p>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="animate-on-scroll">
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="message">Message:</label>
                <textarea id="message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Healthcare Clinic. All rights reserved.</p>
    </footer>
</body>

</html>
